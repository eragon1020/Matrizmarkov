<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Calculadora web de cadenas de Markov aplicada a una sesión de gaming.">
    <title>{% block title %}Cadenas de Markov · Sesión de gaming{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  </head>
  <body>
    <header class="site-header">
      <div class="brand">
        <span class="brand-mark">M</span>
        <div>
          <h1>Cadenas de Markov</h1>
          <p>Sesión de gaming · predicción de estados</p>
        </div>
      </div>
      <nav class="site-nav">
        <a href="{{ url_for('index') }}">Calculadora</a>
        <a href="https://github.com/eragon1020/Matrizmarkov" target="_blank" rel="noreferrer">GitHub</a>
      </nav>
    </header>

    <main class="container">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <p>
        Proyecto académico de Cadenas de Markov, SDD y OpenSpec ·
        <span>v{{ version }}</span>
      </p>
    </footer>

    <script src="{{ url_for('static', filename='vendor/chart.umd.min.js') }}"></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
